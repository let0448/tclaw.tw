# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  # 每日重建,讓排程(未來日期)的文章在當天自動上線。
  # Jekyll 預設跳過未來日期的 post,而 push 觸發的 build 只反映推送當下的日期,
  # 沒有這條 cron 的話,排程文章會一直隱形到下次有人推東西為止。
  # 22:00 UTC = 台灣時間隔日 06:00。
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 1
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Clean vendor templates
        run: find vendor -path "*/site_template/_posts/*" -delete 2>/dev/null || true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
